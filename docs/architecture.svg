<svg viewBox="0 0 1400 980" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#455A64"/>
    </marker>
  </defs>

  <rect width="1400" height="980" fill="#ffffff"/>

  <!-- Title -->
  <text x="700" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0b1326">RiskSearcher — System Architecture</text>
  <text x="700" y="66" text-anchor="middle" font-size="14" fill="#607d8b">ETHOnline 2026 · Continuity Track — The Graph (AI Use Case) + Circle Arc (Treasury)</text>

  <!-- Frontend -->
  <rect x="500" y="95" width="400" height="64" rx="10" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
  <text x="700" y="121" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">React + Vite Frontend</text>
  <text x="700" y="141" text-anchor="middle" font-size="12" fill="#1565c0">Hosted on Vercel</text>

  <line x1="700" y1="159" x2="700" y2="190" stroke="#455A64" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Backend -->
  <rect x="450" y="192" width="500" height="74" rx="10" fill="#ECEFF1" stroke="#455A64" stroke-width="1.5"/>
  <text x="700" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#263238">FastAPI Backend</text>
  <text x="700" y="240" text-anchor="middle" font-size="12" fill="#455A64">Hosted on Render · SSE streaming · single long-lived server (not serverless)</text>
  <text x="700" y="257" text-anchor="middle" font-size="11" fill="#78909c">/analyze · /arc/* · /history</text>

  <!-- Fan-out arrows -->
  <line x1="620" y1="266" x2="280" y2="330" stroke="#455A64" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="266" x2="700" y2="330" stroke="#455A64" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="800" y1="266" x2="1130" y2="330" stroke="#455A64" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- COLUMN A: Analysis Pipeline -->
  <rect x="60" y="332" width="440" height="36" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="280" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">Analysis Pipeline (core/analyzer.py)</text>

  <!-- 5 pipeline stages -->
  <g font-size="10.5" fill="#1b5e20">
    <rect x="66"  y="385" width="78" height="52" rx="6" fill="#ffffff" stroke="#2E7D32"/>
    <text x="105" y="406" text-anchor="middle" font-weight="bold">1</text>
    <text x="105" y="420" text-anchor="middle">Source</text>
    <text x="105" y="432" text-anchor="middle">Fetch</text>

    <line x1="144" y1="411" x2="158" y2="411" stroke="#2E7D32" marker-end="url(#arrow)"/>
    <rect x="160" y="385" width="78" height="52" rx="6" fill="#ffffff" stroke="#2E7D32"/>
    <text x="199" y="406" text-anchor="middle" font-weight="bold">2</text>
    <text x="199" y="420" text-anchor="middle">Rule</text>
    <text x="199" y="432" text-anchor="middle">Engine</text>

    <line x1="238" y1="411" x2="252" y2="411" stroke="#2E7D32" marker-end="url(#arrow)"/>
    <rect x="254" y="385" width="78" height="52" rx="6" fill="#ffffff" stroke="#2E7D32"/>
    <text x="293" y="406" text-anchor="middle" font-weight="bold">3</text>
    <text x="293" y="420" text-anchor="middle">LLM</text>
    <text x="293" y="432" text-anchor="middle">Specialist</text>

    <line x1="332" y1="411" x2="346" y2="411" stroke="#2E7D32" marker-end="url(#arrow)"/>
    <rect x="348" y="385" width="78" height="52" rx="6" fill="#ffffff" stroke="#2E7D32"/>
    <text x="387" y="406" text-anchor="middle" font-weight="bold">4</text>
    <text x="387" y="420" text-anchor="middle">LLM</text>
    <text x="387" y="432" text-anchor="middle">Judge</text>

    <line x1="426" y1="411" x2="440" y2="411" stroke="#2E7D32" marker-end="url(#arrow)"/>
    <rect x="442" y="385" width="78" height="52" rx="6" fill="#ffffff" stroke="#2E7D32"/>
    <text x="481" y="406" text-anchor="middle" font-weight="bold">5</text>
    <text x="481" y="420" text-anchor="middle">Report</text>
    <text x="481" y="432" text-anchor="middle">Gen</text>
  </g>

  <!-- Graph evidence source feeding stage 2/3 -->
  <line x1="150" y1="500" x2="180" y2="443" stroke="#EF6C00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="66" y="502" width="200" height="66" rx="8" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.5"/>
  <text x="166" y="522" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">The Graph</text>
  <text x="166" y="538" text-anchor="middle" font-size="10.5" fill="#ef6c00">Uniswap V3 Gateway</text>
  <text x="166" y="552" text-anchor="middle" font-size="10.5" fill="#ef6c00">live TVL / pools / volume</text>
  <text x="166" y="563" text-anchor="middle" font-size="9.5" fill="#f57c00">rpc/graph_provider.py</text>

  <!-- LLM fallback chain feeding stage 3/4 -->
  <line x1="330" y1="500" x2="310" y2="443" stroke="#C2185B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="284" y="502" width="216" height="66" rx="8" fill="#FCE4EC" stroke="#C2185B" stroke-width="1.5"/>
  <text x="392" y="522" text-anchor="middle" font-size="12" font-weight="bold" fill="#880e4f">LLM Tiered Fallback</text>
  <text x="392" y="538" text-anchor="middle" font-size="10" fill="#ad1457">Anthropic → OpenRouter</text>
  <text x="392" y="551" text-anchor="middle" font-size="10" fill="#ad1457">→ Groq → AgentRouter</text>
  <text x="392" y="563" text-anchor="middle" font-size="9.5" fill="#c2185b">llm/client.py</text>

  <!-- Ground truth footer for column A -->
  <rect x="66" y="585" width="434" height="40" rx="8" fill="#f1f8f2" stroke="#a5d6a7" stroke-width="1"/>
  <text x="283" y="601" text-anchor="middle" font-size="10.5" fill="#2e7d32">Judge overrides rule-based verdict only on a real</text>
  <text x="283" y="615" text-anchor="middle" font-size="10.5" fill="#2e7d32">specialist answer — verified on a 4-contract ground-truth set</text>

  <!-- COLUMN B: Arc Treasury -->
  <rect x="530" y="332" width="340" height="36" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5"/>
  <text x="700" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a148c">Arc Treasury (rpc/arc_provider.py)</text>

  <rect x="530" y="385" width="340" height="50" rx="8" fill="#ffffff" stroke="#7B1FA2" stroke-width="1.5"/>
  <text x="700" y="406" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a148c">Developer-Controlled Wallet</text>
  <text x="700" y="422" text-anchor="middle" font-size="10.5" fill="#6a1b9a">one real wallet per connected address (Circle SDK)</text>

  <line x1="700" y1="435" x2="700" y2="448" stroke="#7B1FA2" marker-end="url(#arrow)"/>
  <rect x="530" y="450" width="340" height="45" rx="8" fill="#ffffff" stroke="#7B1FA2" stroke-width="1.5"/>
  <text x="700" y="468" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a148c">Live USDC Balance</text>
  <text x="700" y="483" text-anchor="middle" font-size="10.5" fill="#6a1b9a">USDC is Arc's native asset, not an ERC-20</text>

  <line x1="700" y1="495" x2="700" y2="508" stroke="#7B1FA2" marker-end="url(#arrow)"/>
  <rect x="530" y="510" width="340" height="52" rx="8" fill="#ffffff" stroke="#7B1FA2" stroke-width="1.5"/>
  <text x="700" y="529" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a148c">Real Transfers</text>
  <text x="700" y="545" text-anchor="middle" font-size="10.5" fill="#6a1b9a">Send · Withdraw · Subscribe (/arc/withdraw, /arc/subscribe)</text>

  <rect x="530" y="575" width="340" height="50" rx="8" fill="#f8f0fa" stroke="#ce93d8" stroke-width="1"/>
  <text x="700" y="593" text-anchor="middle" font-size="10.5" fill="#6a1b9a">ARC_BLOCKCHAIN env var: ARC-TESTNET (default)</text>
  <text x="700" y="608" text-anchor="middle" font-size="10.5" fill="#6a1b9a">→ ARC (mainnet) — config switch, no code change</text>

  <!-- COLUMN C: Scan History -->
  <rect x="910" y="332" width="430" height="36" rx="8" fill="#FFFDE7" stroke="#F9A825" stroke-width="1.5"/>
  <text x="1125" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c5c00">Scan History (db/scan_history_store.py)</text>

  <rect x="910" y="385" width="430" height="50" rx="8" fill="#ffffff" stroke="#F9A825" stroke-width="1.5"/>
  <text x="1125" y="406" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c5c00">Auto-save on scan completion</text>
  <text x="1125" y="422" text-anchor="middle" font-size="10.5" fill="#a17900">no separate save step — /analyze?user_address=...</text>

  <line x1="1125" y1="435" x2="1125" y2="448" stroke="#F9A825" marker-end="url(#arrow)"/>
  <rect x="910" y="450" width="430" height="58" rx="8" fill="#ffffff" stroke="#F9A825" stroke-width="1.5"/>
  <text x="1125" y="471" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c5c00">Firestore · scan_history collection</text>
  <text x="1125" y="487" text-anchor="middle" font-size="10.5" fill="#a17900">keyed by wallet address — survives Render redeploys</text>
  <text x="1125" y="501" text-anchor="middle" font-size="10.5" fill="#a17900">(unlike local disk, which is wiped on every restart)</text>

  <line x1="1125" y1="508" x2="1125" y2="521" stroke="#F9A825" marker-end="url(#arrow)"/>
  <rect x="910" y="523" width="430" height="52" rx="8" fill="#ffffff" stroke="#F9A825" stroke-width="1.5"/>
  <text x="1125" y="542" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c5c00">GET /history?address=...</text>
  <text x="1125" y="558" text-anchor="middle" font-size="10.5" fill="#a17900">loaded on wallet connect, merged into the UI</text>

  <rect x="910" y="585" width="430" height="40" rx="8" fill="#fffdf0" stroke="#ffe082" stroke-width="1"/>
  <text x="1125" y="601" text-anchor="middle" font-size="10.5" fill="#7c5c00">Same resilience pattern as Arc wallets: the external</text>
  <text x="1125" y="615" text-anchor="middle" font-size="10.5" fill="#7c5c00">service is the source of truth, not local disk</text>

  <!-- Divider -->
  <line x1="60" y1="660" x2="1340" y2="660" stroke="#eceff1" stroke-width="1.5"/>

  <!-- Legend -->
  <text x="700" y="690" text-anchor="middle" font-size="12" font-weight="bold" fill="#455A64">Legend</text>
  <g font-size="11" fill="#37474f">
    <rect x="150" y="705" width="16" height="16" rx="3" fill="#E3F2FD" stroke="#1976D2"/>
    <text x="174" y="717">Frontend</text>
    <rect x="290" y="705" width="16" height="16" rx="3" fill="#ECEFF1" stroke="#455A64"/>
    <text x="314" y="717">Backend</text>
    <rect x="420" y="705" width="16" height="16" rx="3" fill="#E8F5E9" stroke="#2E7D32"/>
    <text x="444" y="717">Analysis Pipeline</text>
    <rect x="600" y="705" width="16" height="16" rx="3" fill="#FFF3E0" stroke="#EF6C00"/>
    <text x="624" y="717">The Graph</text>
    <rect x="740" y="705" width="16" height="16" rx="3" fill="#F3E5F5" stroke="#7B1FA2"/>
    <text x="764" y="717">Circle Arc</text>
    <rect x="870" y="705" width="16" height="16" rx="3" fill="#FFFDE7" stroke="#F9A825"/>
    <text x="894" y="717">Firestore</text>
    <rect x="1000" y="705" width="16" height="16" rx="3" fill="#FCE4EC" stroke="#C2185B"/>
    <text x="1024" y="717">LLM Providers</text>
  </g>

  <!-- Footer -->
  <text x="700" y="755" text-anchor="middle" font-size="11.5" fill="#90a4ae">Track qualification: live, load-bearing use of The Graph (reasoning over real evidence, not a raw query dump)</text>
  <text x="700" y="772" text-anchor="middle" font-size="11.5" fill="#90a4ae">and a real Arc-powered treasury feature (deposit, balance, transfer, subscription) in a live multi-chain product.</text>
  <text x="700" y="800" text-anchor="middle" font-size="11" font-style="italic" fill="#b0bec5">World AgentKit / Selfie Check integration in progress — diagram will be extended once merged.</text>
</svg>
